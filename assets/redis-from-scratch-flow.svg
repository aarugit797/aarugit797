<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-labelledby="t d"><title id="t">Redis from scratch flow</title><desc id="d">TCP data passes through RESP parsing, command handling, a hash table, and TTL expiration.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#151529"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5d8ec5"/></marker></defs><rect x="1" y="1" width="1098" height="238" rx="16" fill="url(#bg)" stroke="#263a56"/><text x="25" y="31" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e6eefb">REDIS FROM SCRATCH</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="25" y="66" width="165" height="103" rx="10" fill="#13243a" stroke="#31516e"/><text x="107" y="92" fill="#e6eefb" font-size="14" font-weight="700">Client / TCP</text><text x="107" y="116" fill="#9fb4d0" font-size="12">Raw socket stream</text><text x="107" y="139" fill="#7dd3fc" font-size="11">Buffered reads</text><rect x="230" y="66" width="165" height="103" rx="10" fill="#17213a" stroke="#4c5fa0"/><text x="312" y="92" fill="#e6eefb" font-size="14" font-weight="700">RESP parser</text><text x="312" y="116" fill="#b8c7e6" font-size="12">Arrays and bulk strings</text><text x="312" y="139" fill="#a5b4fc" font-size="11">Protocol boundary</text><rect x="435" y="66" width="165" height="103" rx="10" fill="#162b32" stroke="#347c73"/><text x="517" y="92" fill="#e6eefb" font-size="14" font-weight="700">Command router</text><text x="517" y="116" fill="#b5e7c5" font-size="12">Dispatch by command</text><text x="517" y="139" fill="#6ee7b7" font-size="11">Concurrent clients</text><rect x="640" y="66" width="165" height="103" rx="10" fill="#122b3a" stroke="#26759b"/><text x="722" y="92" fill="#e6eefb" font-size="14" font-weight="700">Hash table</text><text x="722" y="116" fill="#a7d9ef" font-size="12">Key / value storage</text><text x="722" y="139" fill="#7dd3fc" font-size="11">Incremental rehash</text><rect x="845" y="66" width="230" height="103" rx="10" fill="#2a2029" stroke="#8b4b75"/><text x="960" y="92" fill="#e6eefb" font-size="14" font-weight="700">TTL expiration</text><text x="960" y="116" fill="#f3c7df" font-size="12">Passive + active deletion</text><text x="960" y="139" fill="#f0abfc" font-size="11">Expiry is part of behaviour</text></g><g stroke="#5d8ec5" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M190 117 H226"/><path d="M395 117 H431"/><path d="M600 117 H636"/><path d="M805 117 H841"/></g><rect x="25" y="190" width="1050" height="29" rx="8" fill="#142033" stroke="#263a56"/><text x="550" y="209" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="#c2d3ea">Benchmark note: the single-threaded write path was about 20% faster in my test setup than the lock-based version.</text></svg>